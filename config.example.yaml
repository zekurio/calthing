# calthing example configuration.
# Copy to config.yaml and adjust. ${VAR} references are expanded from the
# environment at load time; loading fails if a referenced variable is unset.

listen: ':8080'

cache:
  # How long upstream calendar responses are reused before re-fetching.
  ttl: 10m

calendar:
  # Default window for /calendar.ics and /api/events: today-past_days .. today+future_days.
  past_days: 30
  future_days: 90
  # Added to episode air times to account for download and transcode time.
  availability_delay: 1h
  # X-WR-CALNAME shown by calendar clients.
  name: 'Media Calendar'

auth:
  # Optional: enables Jellyfin login for the web UI and per-user calendar
  # feed tokens. Users sign in with their Jellyfin account; each user gets a
  # personal /calendar.ics?token=… URL signed with this secret. Requires
  # jellyfin.url below. Use a long random string (e.g. `openssl rand -hex 32`);
  # rotating it invalidates every feed URL at once. Leave empty for a public
  # calendar without login.
  secret: ''

instances:
  - name: movies # unique; part of event UIDs — treat as stable, renaming re-creates events in subscribed calendars
    type: radarr
    url: http://127.0.0.1:7878
    api_key: ${RADARR_API_KEY}
    include_unmonitored: false
  - name: tv
    type: sonarr
    url: http://127.0.0.1:8989
    api_key: ${SONARR_API_KEY}
    include_unmonitored: false
# Branding shown above the web calendar. When icon_url is empty, a built-in
# cinema-ticket icon is used. The URL may point to an SVG or raster image.
branding:
  name: calthing
  icon_url: ''
  page_title: 'calthing · Was läuft'
  description: 'Das gemeinsame Film- und Serienprogramm.'

# Optional Jellyfin integration. `url` alone is enough for login (auth.secret);
# `public_url` and `api_key` additionally enable linking events to Jellyfin
# items. `url` is used only server-side; `public_url` is used for links opened
# by calendar visitors.
# jellyfin:
#   url: http://127.0.0.1:8096
#   public_url: https://jellyfin.example.com
#   api_key: ${JELLYFIN_API_KEY}
